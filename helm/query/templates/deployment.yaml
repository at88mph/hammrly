{{- $db := .Values.database -}}
{{- $dbMode := include "hammrly-query.databaseMode" . | trim -}}
{{- if eq $dbMode "invalid" -}}
{{- fail "query.database: set database.url to a full DSN (must contain ://) for dev, or set database.existingSecret with secretKeys.username/password and database.url as host:port/dbname" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hammrly-query.fullname" . }}
  labels:
    {{- include "hammrly-query.labels" . | nindent 4 }}
spec:
  {{- if .Values.hpa.enabled }}
  replicas: {{ .Values.hpa.minReplicas }}
  {{- else }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "hammrly-query.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hammrly-query.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: query
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if eq $dbMode "assembled" }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              export HAMMRLY_DATABASE_URL="postgresql+psycopg2://${HAMMRLY_DB_USER}:${HAMMRLY_DB_PASSWORD}@{{ $db.url }}"
              exec hammrly-query
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: HAMMRLY_HOST
              value: "0.0.0.0"
            - name: HAMMRLY_PORT
              value: {{ .Values.service.port | quote }}
            {{- if eq $dbMode "inline" }}
            - name: HAMMRLY_DATABASE_URL
              value: {{ $db.url | quote }}
            {{- else if eq $dbMode "assembled" }}
            - name: HAMMRLY_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $db.existingSecret }}
                  key: {{ $db.secretKeys.username }}
            - name: HAMMRLY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $db.existingSecret }}
                  key: {{ $db.secretKeys.password }}
            {{- end }}
            {{- if .Values.jwt.devHmacSecret }}
            - name: HAMMRLY_JWT_DEV_HMAC_SECRET
              value: {{ .Values.jwt.devHmacSecret | quote }}
            {{- end }}
            {{- if .Values.jwt.jwksUrl }}
            - name: HAMMRLY_JWT_JWKS_URL
              value: {{ .Values.jwt.jwksUrl | quote }}
            {{- end }}
            {{- if .Values.jwt.issuer }}
            - name: HAMMRLY_JWT_ISSUER
              value: {{ .Values.jwt.issuer | quote }}
            {{- end }}
            {{- if .Values.jwt.audience }}
            - name: HAMMRLY_JWT_AUDIENCE
              value: {{ .Values.jwt.audience | quote }}
            {{- end }}
            {{- if .Values.jwt.requiredScopes }}
            - name: HAMMRLY_JWT_REQUIRED_SCOPES
              value: {{ .Values.jwt.requiredScopes | quote }}
            {{- end }}
            {{- if .Values.httpPathPrefix }}
            - name: HAMMRLY_HTTP_PATH_PREFIX
              value: {{ .Values.httpPathPrefix | quote }}
            {{- end }}
            {{- if .Values.clusterId }}
            - name: HAMMRLY_CLUSTER_ID
              value: {{ .Values.clusterId | quote }}
            {{- end }}
            {{- if .Values.redisUrl }}
            - name: HAMMRLY_REDIS_URL
              value: {{ .Values.redisUrl | quote }}
            {{- end }}
            {{- range .Values.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ printf "%s%s" (include "hammrly-query.httpPathPrefixNormalized" .) "/healthz" | replace "//" "/" | quote }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: {{ printf "%s%s" (include "hammrly-query.httpPathPrefixNormalized" .) "/readyz" | replace "//" "/" | quote }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
