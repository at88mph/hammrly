{{- if .Values.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "oauth2-proxy.fullname" . }}
  labels:
    {{- include "oauth2-proxy.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingressClassName }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ include "oauth2-proxy.ingressHost" . | quote }}
      http:
        paths:
          - path: /oauth2/
            pathType: Prefix
            backend:
              service:
                name: {{ include "oauth2-proxy.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
