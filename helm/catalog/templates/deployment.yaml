apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hammrly-catalog.fullname" . }}
  labels:
    {{- include "hammrly-catalog.labels" . | nindent 4 }}
spec:
  {{- if .Values.hpa.enabled }}
  replicas: {{ .Values.hpa.minReplicas }}
  {{- else }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "hammrly-catalog.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hammrly-catalog.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: catalog
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: HAMMRLY_HOST
              value: "0.0.0.0"
            - name: HAMMRLY_PORT
              value: {{ .Values.service.port | quote }}
            - name: HAMMRLY_TAP_SYNC_URL
              value: {{ required "catalog.tap.syncUrl is required" .Values.tap.syncUrl | quote }}
            - name: HAMMRLY_TAP_TABLE
              value: {{ .Values.tap.table | quote }}
            - name: HAMMRLY_TAP_RESPONSE_FORMAT
              value: {{ .Values.tap.responseFormat | quote }}
            - name: HAMMRLY_TAP_TIMEOUT_SECONDS
              value: {{ .Values.tap.timeoutSeconds | quote }}
            - name: HAMMRLY_TAP_CACHE_TTL_SECONDS
              value: {{ .Values.tap.cacheTtlSeconds | quote }}
            - name: HAMMRLY_TAP_CACHE_MAX_ROWS
              value: {{ .Values.tap.cacheMaxRows | quote }}
            - name: HAMMRLY_TAP_SEARCH_COLUMNS
              value: {{ .Values.tap.searchColumns | join "," | quote }}
            {{- range .Values.tap.columns }}
            {{- $name := required "catalog.tap.columns[].name is required" .name }}
            {{- $column := required (printf "catalog.tap.columns[%s].column is required" $name) .column }}
            - name: {{ printf "HAMMRLY_TAP_COLUMN_%s" ($name | replace "-" "_" | upper) }}
              value: {{ $column | quote }}
            {{- end }}
            - name: HAMMRLY_SEARCH_MAX_TERMS
              value: {{ .Values.search.maxTerms | quote }}
            - name: HAMMRLY_SEARCH_MAX_TERM_LENGTH
              value: {{ .Values.search.maxTermLength | quote }}
            - name: HAMMRLY_LIST_DEFAULT_LIMIT
              value: {{ .Values.list.defaultLimit | quote }}
            - name: HAMMRLY_LIST_MAX_LIMIT
              value: {{ .Values.list.maxLimit | quote }}
            {{- if .Values.httpPathPrefix }}
            - name: HAMMRLY_HTTP_PATH_PREFIX
              value: {{ .Values.httpPathPrefix | quote }}
            {{- end }}
            {{- if .Values.jwt.devHmacSecret }}
            - name: HAMMRLY_JWT_DEV_HMAC_SECRET
              value: {{ .Values.jwt.devHmacSecret | quote }}
            {{- end }}
            {{- if .Values.jwt.jwksUrl }}
            - name: HAMMRLY_JWT_JWKS_URL
              value: {{ .Values.jwt.jwksUrl | quote }}
            {{- end }}
            {{- if .Values.jwt.issuer }}
            - name: HAMMRLY_JWT_ISSUER
              value: {{ .Values.jwt.issuer | quote }}
            {{- end }}
            {{- if .Values.jwt.audience }}
            - name: HAMMRLY_JWT_AUDIENCE
              value: {{ .Values.jwt.audience | quote }}
            {{- end }}
            {{- if .Values.jwt.requiredScopes }}
            - name: HAMMRLY_JWT_REQUIRED_SCOPES
              value: {{ .Values.jwt.requiredScopes | quote }}
            {{- end }}
            {{- range .Values.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ printf "%s%s" (include "hammrly-catalog.httpPathPrefixNormalized" .) "/healthz" | replace "//" "/" | quote }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: {{ printf "%s%s" (include "hammrly-catalog.httpPathPrefixNormalized" .) "/readyz" | replace "//" "/" | quote }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
