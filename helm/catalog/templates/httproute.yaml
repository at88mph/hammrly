{{- if .Values.httpRoute.enabled -}}
{{- if eq (len .Values.httpRoute.parentRefs) 0 -}}
{{- fail "catalog.httpRoute.enabled requires httpRoute.parentRefs (Gateway or other parent)" -}}
{{- end -}}
apiVersion: {{ .Values.httpRoute.apiVersion | default "gateway.networking.k8s.io/v1" }}
kind: HTTPRoute
metadata:
  name: {{ include "hammrly-catalog.fullname" . }}
  labels:
    {{- include "hammrly-catalog.labels" . | nindent 4 }}
    {{- with .Values.httpRoute.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- if .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        {{- toYaml .Values.httpRoute.matches | nindent 8 }}
      {{- with .Values.httpRoute.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        {{- if .Values.httpRoute.backendRefs }}
        {{- toYaml .Values.httpRoute.backendRefs | nindent 8 }}
        {{- else }}
        - group: ""
          kind: Service
          name: {{ include "hammrly-catalog.fullname" . }}
          port: {{ .Values.service.port }}
          weight: 1
        {{- end }}
{{- end }}
