{{- $prefix := include "hammrly-portal.httpPathPrefixNormalized" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hammrly-portal.fullname" . }}-nginx
  labels:
    {{- include "hammrly-portal.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # TLS terminates at the edge proxy; this pod listens on plain HTTP.
        absolute_redirect off;
        port_in_redirect off;
{{- with .Values.nginx.trustedProxyCidrs }}
{{- range . }}
        set_real_ip_from {{ . }};
{{- end }}
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;
{{- end }}

    {{- if $prefix }}
        location = {{ $prefix }}/config.json {
            add_header Cache-Control "no-cache";
            alias /usr/share/nginx/html/config.json;
        }

        location {{ $prefix }}/ {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ {{ $prefix }}/index.html;
        }

        location = {{ $prefix }} {
            return 301 {{ $prefix }}/;
        }

        location = / {
            try_files /index.html =404;
        }
    {{- else }}
        location = /config.json {
            add_header Cache-Control "no-cache";
            try_files /config.json =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    {{- end }}
    }
