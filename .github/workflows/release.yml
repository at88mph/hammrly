# Release pipeline: build/push images to GHCR, bump Helm, publish charts as OCI.
#
# Triggers:
#   - GitHub Release published (UI or API; tag may be 0.2.1 or v0.2.1), or
#   - run workflow_dispatch and set release_tag (release must already exist)
#
# Images are published as:
#   ghcr.io/<owner>/<repo>/{gateway,orchestrator,query,catalog,portal}:{tag,latest}
#   ghcr.io/<owner>/<repo>/{desktop-base,desktop-astronomy}:{tag,latest}
#
# Helm charts (gateway, orchestrator, query, catalog, portal, stack) are
# packaged and pushed as OCI artifacts to GitHub Container Registry:
#   oci://ghcr.io/<owner>/<repo>/charts/<chart-name>
# Example:
#   helm pull oci://ghcr.io/at88mph/hammrly/charts/hammrly-stack --version 1.2.0

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build (e.g. 0.2.1 or v0.2.1)."
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      chart_version: ${{ steps.resolve.outputs.chart_version }}
      image_prefix: ${{ steps.resolve.outputs.image_prefix }}
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.release_tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ github.ref_name }}"
          fi
          if [ -z "${tag}" ]; then
            echo "Release tag is empty" >&2
            exit 1
          fi
          chart_version="${tag#v}"
          # GHCR package names must be lowercase.
          image_prefix="$(echo '${{ env.IMAGE_PREFIX }}' | tr '[:upper:]' '[:lower:]')"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${chart_version}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=${image_prefix}" >> "$GITHUB_OUTPUT"
          echo "Resolved TAG=${tag} CHART_VERSION=${chart_version} IMAGE_PREFIX=${image_prefix}"

  build-push-services:
    name: Push ${{ matrix.service }}
    needs: resolve-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            dockerfile: services/gateway/Dockerfile
          - service: orchestrator
            dockerfile: services/orchestrator/Dockerfile
          - service: query
            dockerfile: services/query/Dockerfile
          - service: catalog
            dockerfile: services/catalog/Dockerfile
          - service: portal
            dockerfile: services/portal/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ needs.resolve-tag.outputs.image_prefix }}/${{ matrix.service }}:${{ needs.resolve-tag.outputs.tag }}
            ${{ needs.resolve-tag.outputs.image_prefix }}/${{ matrix.service }}:latest
          cache-from: |
            type=gha,scope=release-${{ matrix.service }}
            type=registry,ref=${{ needs.resolve-tag.outputs.image_prefix }}/${{ matrix.service }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=release-${{ matrix.service }}
            type=registry,ref=${{ needs.resolve-tag.outputs.image_prefix }}/${{ matrix.service }}:buildcache,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.resolve-tag.outputs.tag }}

  build-push-desktop-base:
    name: Push desktop-base
    needs: resolve-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/desktop/base/Dockerfile
          push: true
          tags: |
            ${{ needs.resolve-tag.outputs.image_prefix }}/desktop-base:${{ needs.resolve-tag.outputs.tag }}
            ${{ needs.resolve-tag.outputs.image_prefix }}/desktop-base:latest
          cache-from: |
            type=gha,scope=release-desktop-base
            type=registry,ref=${{ needs.resolve-tag.outputs.image_prefix }}/desktop-base:buildcache
          cache-to: |
            type=gha,mode=max,scope=release-desktop-base
            type=registry,ref=${{ needs.resolve-tag.outputs.image_prefix }}/desktop-base:buildcache,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.resolve-tag.outputs.tag }}

  build-push-desktop-astronomy:
    name: Push desktop-astronomy
    needs: [resolve-tag, build-push-desktop-base]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/desktop/astronomy/Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ needs.resolve-tag.outputs.image_prefix }}/desktop-base:${{ needs.resolve-tag.outputs.tag }}
          tags: |
            ${{ needs.resolve-tag.outputs.image_prefix }}/desktop-astronomy:${{ needs.resolve-tag.outputs.tag }}
            ${{ needs.resolve-tag.outputs.image_prefix }}/desktop-astronomy:latest
          cache-from: |
            type=gha,scope=release-desktop-astronomy
            type=registry,ref=${{ needs.resolve-tag.outputs.image_prefix }}/desktop-astronomy:buildcache
          cache-to: |
            type=gha,mode=max,scope=release-desktop-astronomy
            type=registry,ref=${{ needs.resolve-tag.outputs.image_prefix }}/desktop-astronomy:buildcache,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.resolve-tag.outputs.tag }}

  # Disabled until a GPU-enabled runner is available (matches former GitLab job).
  # build-push-desktop-gpu:
  #   name: Push desktop-astronomy-gpu
  #   needs: [resolve-tag, build-push-desktop-astronomy]
  #   runs-on: ubuntu-latest
  #   steps: ...

  helm-publish:
    name: Publish Helm charts
    needs:
      - resolve-tag
      - build-push-services
      - build-push-desktop-astronomy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Install yq
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq

      - name: Bump chart versions and image refs
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          CHART_VERSION: ${{ needs.resolve-tag.outputs.chart_version }}
          GW: ${{ needs.resolve-tag.outputs.image_prefix }}/gateway
          ORCH: ${{ needs.resolve-tag.outputs.image_prefix }}/orchestrator
          QRY: ${{ needs.resolve-tag.outputs.image_prefix }}/query
          CAT: ${{ needs.resolve-tag.outputs.image_prefix }}/catalog
          PRT: ${{ needs.resolve-tag.outputs.image_prefix }}/portal
        run: |
          set -euo pipefail
          for chart in gateway orchestrator query catalog portal stack; do
            yq -i ".version = strenv(CHART_VERSION) | .appVersion = strenv(TAG)" "helm/${chart}/Chart.yaml"
          done

          yq -i '.image.repository = strenv(GW) | .image.tag = strenv(TAG)' helm/gateway/values.yaml
          yq -i '.image.repository = strenv(ORCH) | .image.tag = strenv(TAG)' helm/orchestrator/values.yaml
          yq -i '.image.repository = strenv(QRY) | .image.tag = strenv(TAG)' helm/query/values.yaml
          yq -i '.image.repository = strenv(CAT) | .image.tag = strenv(TAG)' helm/catalog/values.yaml
          yq -i '.image.repository = strenv(PRT) | .image.tag = strenv(TAG)' helm/portal/values.yaml
          yq -i ".gateway.image.repository = strenv(GW) | .gateway.image.tag = strenv(TAG) | .orchestrator.image.repository = strenv(ORCH) | .orchestrator.image.tag = strenv(TAG) | .query.image.repository = strenv(QRY) | .query.image.tag = strenv(TAG) | .catalog.image.repository = strenv(CAT) | .catalog.image.tag = strenv(TAG) | .portal.image.repository = strenv(PRT) | .portal.image.tag = strenv(TAG)" helm/stack/values.yaml

          yq -i ".dependencies[] |= .version = strenv(CHART_VERSION)" helm/stack/Chart.yaml
          helm dependency update helm/stack

      - name: Package charts
        run: |
          set -euo pipefail
          mkdir -p dist/charts
          for chart in gateway orchestrator query catalog portal; do
            helm package --dependency-update "helm/${chart}" -d dist/charts
          done
          helm package --dependency-update helm/stack -d dist/charts
          ls -la dist/charts/

      - name: Log in to GHCR (Helm OCI)
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Push charts to GHCR as OCI
        env:
          CHART_VERSION: ${{ needs.resolve-tag.outputs.chart_version }}
          IMAGE_PREFIX_LC: ${{ needs.resolve-tag.outputs.image_prefix }}
        run: |
          set -euo pipefail
          chart_oci="oci://${IMAGE_PREFIX_LC}/charts"
          {
            echo "## Helm OCI packages"
            echo ""
            echo "Registry: \`${chart_oci}\`"
            echo ""
            echo "| Chart | Pull |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for pkg in dist/charts/*.tgz; do
            echo "Pushing ${pkg} to ${chart_oci}"
            helm push "${pkg}" "${chart_oci}"
            base="$(basename "${pkg}" .tgz)"
            # hammrly-stack-1.2.0 -> hammrly-stack
            name="${base%-${CHART_VERSION}}"
            echo "| \`${name}\` | \`helm pull ${chart_oci}/${name} --version ${CHART_VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Commit Helm release bump
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No Helm file changes to commit."
          else
            git add helm/
            git commit -m "chore(helm): release ${TAG} images and chart versions"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Attach chart packages to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Upload only — do not create a release (avoids re-triggering this workflow).
          gh release upload "${TAG}" dist/charts/*.tgz --clobber
