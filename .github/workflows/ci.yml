# Container validation on pull requests and pushes to main/master.
#
# Service images (gateway, orchestrator, query, catalog, portal):
#   multi-arch build only (cacheonly) — no registry push.
#
# Desktop images (base → astronomy → gpu) are not built here; maintain them
# via release workflow, manual builds, or a separate pipeline.

name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            dockerfile: services/gateway/Dockerfile
          - service: orchestrator
            dockerfile: services/orchestrator/Dockerfile
          - service: query
            dockerfile: services/query/Dockerfile
          - service: catalog
            dockerfile: services/catalog/Dockerfile
          - service: portal
            dockerfile: services/portal/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (cacheonly)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          outputs: type=cacheonly
          cache-from: type=gha,scope=service-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=service-${{ matrix.service }}
