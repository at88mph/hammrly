[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hammrly-orchestrator"
version = "0.1.0"
description = "Hammrly orchestrator — consumes job submissions from Redis Streams"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "redis>=5.0.0",
    "pydantic-settings>=2.0.0",
    "kubernetes>=28.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "fakeredis>=2.23.0",
]

[project.scripts]
hammrly-orchestrator = "hammrly_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
